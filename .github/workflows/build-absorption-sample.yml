name: Build Absorption sample AZW3

on:
  push:
    branches: [main]
    paths:
      - "samples/absorption/**"
      - ".github/workflows/build-absorption-sample.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc calibre python3-matplotlib unzip
      - name: Generate charts
        run: python3 samples/absorption/generate_assets.py
      - name: Build EPUB and AZW3
        run: |
          mkdir -p samples/absorption/output
          cd samples/absorption
          pandoc chapter_absorption.md -o output/Absorption_Hap_thu_cung_cau.epub --toc --toc-depth=3 --css=kindle.css --metadata lang=vi-VN --resource-path=.
          ebook-convert output/Absorption_Hap_thu_cung_cau.epub output/Absorption_Hap_thu_cung_cau.azw3 --output-profile kindle_pw3
          ebook-meta output/Absorption_Hap_thu_cung_cau.azw3
          unzip -t output/Absorption_Hap_thu_cung_cau.epub
      - name: Commit built sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/absorption/assets samples/absorption/output
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build Absorption Kindle sample [skip ci]"
            git push
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Absorption-Kindle3-Sample
          path: |
            samples/absorption/output/Absorption_Hap_thu_cung_cau.azw3
            samples/absorption/output/Absorption_Hap_thu_cung_cau.epub
