name: Build Book2 Kindle chapters

on:
  push:
    branches: [main]
    paths:
      - "book2/**"
      - "samples/absorption/**"
      - ".github/workflows/build-book2.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc calibre python3-matplotlib unzip

      - name: Generate charts
        run: |
          python3 samples/absorption/generate_assets.py
          python3 book2/generate_assets.py

      - name: Build individual chapters
        run: |
          mkdir -p book2/output
          cd book2
          for src in chapters/*.md; do
            base="$(basename "$src" .md)"
            pandoc "$src"               -o "output/${base}.epub"               --toc --toc-depth=3               --css=kindle.css               --metadata lang=vi-VN               --resource-path=.
            ebook-convert "output/${base}.epub" "output/${base}.azw3"               --output-profile kindle_pw3
            ebook-meta "output/${base}.azw3"
            unzip -t "output/${base}.epub"
          done

      - name: Build combined book from Absorption onward
        run: |
          pandoc             samples/absorption/chapter_absorption.md             book2/chapters/*.md             -o book2/output/Wyckoff_VSA_Tu_Absorption.epub             --toc --toc-depth=3             --css=book2/kindle.css             --metadata title="Wyckoff VSA – Từ Absorption đến các bài học nâng cao"             --metadata lang=vi-VN             --resource-path="samples/absorption:book2"
          ebook-convert             book2/output/Wyckoff_VSA_Tu_Absorption.epub             book2/output/Wyckoff_VSA_Tu_Absorption.azw3             --output-profile kindle_pw3
          ebook-meta book2/output/Wyckoff_VSA_Tu_Absorption.azw3
          unzip -t book2/output/Wyckoff_VSA_Tu_Absorption.epub

      - name: Commit generated assets and outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/absorption/assets book2/assets book2/output
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build Book2 Kindle chapters [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Book2-Kindle11-Chapters
          path: |
            book2/output/*.azw3
            book2/output/*.epub
